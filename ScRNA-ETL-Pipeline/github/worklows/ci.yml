name: CI

on:  
  push:
  pull_request:

jobs:
  pipeline-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Nextflow stub-run
        wokring-directory: pipeline
        run: |
          nextflow run main.nf -profile local -stub-run --reads "NO_READS" || true
          nextflow run main.nf -help

  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build API 
        run: |
          docker build -t scetl-api:ci ./api